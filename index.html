<!DOCTYPE html>
<html>
<head>
    <title>AI Phishing URL Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding: 30px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>AI Phishing URL Scanner</h1>

    <p>Enter a website URL to check for suspicious signs.</p>

    <input id="urlInput" type="text" placeholder="https://example.com">

    <br>

    <button onclick="scanURL()">Scan URL</button>

    <div id="result"></div>
</div>

<script>
function scanURL() {

    let url = document.getElementById("urlInput").value.toLowerCase();
    let result = document.getElementById("result");

    if (url === "") {
        result.innerHTML = "⚠️ Please enter a URL.";
        return;
    }

    let suspiciousWords = [
        "login",
        "verify",
        "account",
        "password",
        "secure",
        "free",
        "claim",
        "bank"
    ];

    let score = 0;

    if (!url.startsWith("https://")) {
        score += 30;
    }

    for (let word of suspiciousWords) {
        if (url.includes(word)) {
            score += 10;
        }
    }

    if (url.includes("@")) {
        score += 20;
    }

    if (url.length > 75) {
        score += 20;
    }

    iif (score >= 50) {
    result.innerHTML = "🔴 High Risk - Suspicious URL";
} else if (score >= 20) {
    result.innerHTML = "🟠 Medium Risk - Be Careful";
} else {
    result.innerHTML = "🟢 Low Risk - URL looks safe";
    }
